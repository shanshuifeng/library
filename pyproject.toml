[project]
name = "book-manager"
version = "0.1.0"
description = "大学图书管理系统"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-restx>=1.3.2",
    "flask-sqlalchemy>=3.1.1",
    "marshmallow>=4.3.0",
    "mcp>=1.28.1",
    "psycopg[binary]>=3.2",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.workspace]
members = [
    "backend",
]
